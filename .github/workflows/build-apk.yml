name: Build Android APK

# Ricompila l'APK firmato ad ogni push su qualsiasi branch e ad ogni esecuzione manuale.
# Scarica l'APK dalla scheda "Artifacts" della run (pagina Actions del repo).
#
# PREREQUISITO: configurare i secret del repository (Settings > Secrets and variables > Actions):
#   ANDROID_KEYSTORE_BASE64   (contenuto di android/keystore-base64.txt)
#   ANDROID_KEYSTORE_PASSWORD (pfc12345)
#   ANDROID_KEY_ALIAS         (portalePfc)
#   ANDROID_KEY_PASSWORD      (pfc12345)
#   NEXT_PUBLIC_API_URL       (https://portale-pfc-v2.vercel.app)
on:
  push:
    branches: ["**"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build release APK
    runs-on: ubuntu-latest
    env:
      # URL del backend v2 usato in fase di build (static export).
      NEXT_PUBLIC_API_URL: ${{ secrets.NEXT_PUBLIC_API_URL || 'https://portale-pfc-v2.vercel.app' }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Setup JDK 21 (Microsoft)
        uses: actions/setup-java@v4
        with:
          distribution: "microsoft"
          java-version: "21"

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      # Il runner parte pulito: servono le licenze + i pacchetti SDK (compileSdk 35).
      - name: Accetta licenze e installa Android SDK 35 + build-tools 35.0.0
        run: |
          SDKMGR=$(ls "$ANDROID_HOME"/cmdline-tools/*/bin/sdkmanager | head -n1)
          echo "sdkmanager: $SDKMGR"
          yes | "$SDKMGR" --licenses > /dev/null || true
          "$SDKMGR" "platforms;android-35" "build-tools;35.0.0"

      - name: Install npm dependencies
        run: npm install --no-audit --no-fund

      - name: Build web assets (Next.js static export -> out/)
        run: npm run build

      - name: Capacitor sync (copia web assets nel native project)
        run: npx cap sync android

      # Controllo esplicito: senza i secret la build fallirebbe in modo oscuro.
      - name: Verifica presenza secret di firma
        run: |
          if [ -z "${{ secrets.ANDROID_KEYSTORE_BASE64 }}" ] || [ -z "${{ secrets.ANDROID_KEYSTORE_PASSWORD }}" ]; then
            echo "ERRORE: secret ANDROID_KEYSTORE_BASE64 / ANDROID_KEYSTORE_PASSWORD mancanti."
            echo "Aggiungili in Settings > Secrets and variables > Actions, poi rilancia la build."
            exit 1
          fi

      - name: Decodifica keystore di firma da secret
        run: echo "${{ secrets.ANDROID_KEYSTORE_BASE64 }}" | base64 -d > android/app/release-key.jks

      - name: Scrive keystore.properties dai secret
        run: printf 'storeFile=release-key.jks\nstorePassword=%s\nkeyAlias=%s\nkeyPassword=%s\n' "${{ secrets.ANDROID_KEYSTORE_PASSWORD }}" "${{ secrets.ANDROID_KEY_ALIAS }}" "${{ secrets.ANDROID_KEY_PASSWORD }}" > android/keystore.properties

      - name: Rendi gradlew eseguibile
        run: chmod +x android/gradlew

      - name: Build release APK (firmato)
        run: cd android && ./gradlew assembleRelease --no-daemon

      - name: Upload APK come artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-release-apk
          path: android/app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error
