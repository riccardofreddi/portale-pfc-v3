name: Build Android APK

# Ricompila l'APK firmato ad ogni push su qualsiasi branch e ad ogni esecuzione manuale.
# Scarica l'APK dalla scheda "Artifacts" della run (pagina Actions del repo).
#
# La firma usa un keystore SELF-SIGNED generato al volo nella CI con `keytool`:
# NON serve configurare nessun secret di firma.
# Trade-off: la chiave cambia a ogni run, quindi per aggiornare l'app sul device
# devi disinstallare la versione precedente (firma diversa). Per test/verifica
# notifiche FCM va benissimo.
# Opzionale: secret NEXT_PUBLIC_API_URL (default https://portale-pfc-v2.vercel.app).
on:
  push:
    branches: ["**"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build release APK
    runs-on: ubuntu-latest
    env:
      # URL del backend v2 usato in fase di build (static export).
      NEXT_PUBLIC_API_URL: ${{ secrets.NEXT_PUBLIC_API_URL || 'https://portale-pfc-v2.vercel.app' }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Setup JDK 21 (Microsoft)
        uses: actions/setup-java@v4
        with:
          distribution: "microsoft"
          java-version: "21"

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      # Il runner parte pulito: servono le licenze + i pacchetti SDK (compileSdk 35).
      - name: Accetta licenze e installa Android SDK 35 + build-tools 35.0.0
        run: |
          SDKMGR=$(ls "$ANDROID_HOME"/cmdline-tools/*/bin/sdkmanager | head -n1)
          echo "sdkmanager: $SDKMGR"
          yes | "$SDKMGR" --licenses > /dev/null || true
          "$SDKMGR" "platforms;android-35" "build-tools;35.0.0"

      - name: Install npm dependencies
        run: npm install --no-audit --no-fund

      - name: Build web assets (Next.js static export -> out/)
        run: npm run build

      - name: Capacitor sync (copia web assets nel native project)
        run: npx cap sync android

      # Keystore self-signed generato nella CI: nessun secret richiesto.
      - name: Genera keystore di firma self-signed (effimero)
        run: |
          mkdir -p android/app
          "$JAVA_HOME/bin/keytool" -genkeypair -v \
            -keystore android/app/release-key.jks \
            -keyalg RSA -keysize 2048 -validity 10000 \
            -alias portalePfc \
            -storepass pfc12345 -keypass pfc12345 \
            -dname "CN=Portale PFC, OU=DEV, O=PFC, L=Locale, S=Locale, C=IT"

      - name: Scrive keystore.properties
        run: printf 'storeFile=release-key.jks\nstorePassword=pfc12345\nkeyAlias=portalePfc\nkeyPassword=pfc12345\n' > android/keystore.properties

      - name: Rendi gradlew eseguibile
        run: chmod +x android/gradlew

      - name: Build release APK (firmato)
        run: cd android && ./gradlew assembleRelease --no-daemon

      - name: Upload APK come artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-release-apk
          path: android/app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error
