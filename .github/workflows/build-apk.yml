name: Build Android APK

# Ricompila l'APK firmato ad ogni push su qualsiasi branch e ad ogni esecuzione manuale.
#
# Firma STABILE: il keystore e la password arrivano dai GitHub Secrets
# (KEYSTORE_B64, KEYSTORE_PASSWORD), quindi la firma NON cambia tra le build.
# => puoi installare il nuovo APK SOPRA la versione precedente, senza disinstallare.
#
# Dove trovare l'APK: viene pubblicato su una GitHub Release chiamata "latest-apk"
# (pagina "Releases" del repo, sempre lo stesso posto). C'e' anche l'artifact di
# fallback nella scheda Artifacts della singola run (pagina Actions).
#
# Secrets richiesti nel repo (Settings -> Secrets and variables -> Actions):
#   - KEYSTORE_B64        : base64 del keystore (android/app/release-key.jks)
#   - KEYSTORE_PASSWORD   : password del keystore (store+key)
#   - GOOGLE_SERVICES_B64 : base64 di android/app/google-services.json (NON committato)
#   - NEXT_PUBLIC_API_URL : opzionale (default https://portale-pfc-v2.vercel.app)
on:
  push:
    branches: ["**"]
  workflow_dispatch:

permissions:
  contents: write # necessario per creare/aggiornare la Release

jobs:
  build:
    name: Build release APK
    runs-on: ubuntu-latest
    env:
      # URL del backend v2 usato in fase di build (static export).
      NEXT_PUBLIC_API_URL: ${{ secrets.NEXT_PUBLIC_API_URL || 'https://portale-pfc-v2.vercel.app' }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Setup JDK 21 (Microsoft)
        uses: actions/setup-java@v4
        with:
          distribution: "microsoft"
          java-version: "21"

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      # Il runner parte pulito: servono le licenze + i pacchetti SDK (compileSdk 35).
      - name: Accetta licenze e installa Android SDK 35 + build-tools 35.0.0
        run: |
          SDKMGR=$(ls "$ANDROID_HOME"/cmdline-tools/*/bin/sdkmanager | head -n1)
          echo "sdkmanager: $SDKMGR"
          yes | "$SDKMGR" --licenses > /dev/null || true
          "$SDKMGR" "platforms;android-35" "build-tools;35.0.0"

      - name: Install npm dependencies
        run: npm install --no-audit --no-fund

      - name: Build web assets (Next.js static export -> out/)
        run: npm run build

      - name: Capacitor sync (copia web assets nel native project)
        run: npx cap sync android

      # --- Firma STABILE: keystore dai secret (stessa firma a ogni build) ---
      - name: Decodifica keystore di firma dai secret
        env:
          KEYSTORE_B64: ${{ secrets.KEYSTORE_B64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
        run: |
          mkdir -p android/app
          if [ -z "$KEYSTORE_B64" ]; then
            echo "::error::Secret KEYSTORE_B64 mancante. Aggiungilo in Settings > Secrets and variables > Actions."
            exit 1
          fi
          # tr -d rimuove spazi/ritorni a capo accidentali incollati nel secret
          echo "$KEYSTORE_B64" | tr -d '[:space:]' | base64 -d > android/app/release-key.jks
          echo "Keystore decodificato ($(wc -c < android/app/release-key.jks) byte)."

      - name: Verifica keystore + scrive keystore.properties
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
        run: |
          if [ -z "$KEYSTORE_PASSWORD" ]; then
            echo "::error::Secret KEYSTORE_PASSWORD mancante."
            exit 1
          fi
          # Fallisce subito con messaggio chiaro se password/keystore non combaciano
          keytool -list -keystore android/app/release-key.jks \
            -storepass "$KEYSTORE_PASSWORD" -alias portalePfc >/dev/null
          echo "Keystore valido (alias portalePfc OK)."
          printf 'storeFile=release-key.jks\nstorePassword=%s\nkeyAlias=portalePfc\nkeyPassword=%s\n' \
            "$KEYSTORE_PASSWORD" "$KEYSTORE_PASSWORD" > android/keystore.properties

      # --- google-services.json dai secret (NON committato -> niente secret scanning) ---
      - name: Decodifica e verifica google-services.json dai secret
        env:
          GOOGLE_SERVICES_B64: ${{ secrets.GOOGLE_SERVICES_B64 }}
        run: |
          if [ -z "$GOOGLE_SERVICES_B64" ]; then
            echo "::error::Secret GOOGLE_SERVICES_B64 mancante."
            exit 1
          fi
          echo "$GOOGLE_SERVICES_B64" | tr -d '[:space:]' | base64 -d > android/app/google-services.json
          python3 -c "import json; json.load(open('android/app/google-services.json')); print('google-services.json: JSON valido.')"

      - name: Rendi gradlew eseguibile
        run: chmod +x android/gradlew

      - name: Build release APK (firmato)
        run: cd android && ./gradlew assembleRelease --no-daemon

      - name: Upload APK come artifact (fallback)
        uses: actions/upload-artifact@v4
        with:
          name: app-release-apk
          path: android/app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error

      - name: Pubblica APK su GitHub Release "latest-apk"
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest-apk
          name: App APK (latest)
          make_latest: true
          body: |
            APK firmato generato automaticamente dalla CI.
            Installa sul telefono: sovrascrive la versione precedente (firma stabile, stessa chiave).
          files: android/app/build/outputs/apk/release/app-release.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
